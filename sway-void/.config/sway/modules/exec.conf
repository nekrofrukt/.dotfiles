exec_always sh -c "pkill swaybg; swaybg -i ~/.dotfiles/walls/night01.jpg -m fill"
exec sh -c 'dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus --fork && dbus-update-activation-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DBUS_SESSION_BUS_ADDRESS'
exec mako
exec pipewire
exec blueman-applet
exec nm-applet
exec dropbox start

# Idle conf
exec swayidle -w \
    timeout 300 'swaylock -f -c 000000' \
    timeout 600 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f -c 000000'
