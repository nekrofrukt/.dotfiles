# xbps-src packages to check for updates
# Format: pkgname | source_type | source_args | distfile_suffix | running_check
#
# Supported source_types:
#   github  - checks GitHub releases latest tag
#             source_args: owner/repo
#             distfile_suffix: {pkgname}-{version}.tar.gz (default)
#             running_check: comma-separated process names to check before updating
#
# To add a new package, append a line below.
obsidian|github|obsidianmd/obsidian-releases||obsidian
brave-origin|github|brave/brave-browser|brave-origin-{version}-linux-amd64.zip|brave-origin,brave
