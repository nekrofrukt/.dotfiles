# xbps-src packages to check for updates
# Format: pkgname | source_type | source_args
#
# Supported source_types:
#   github  - checks GitHub releases latest tag
#             source_args: owner/repo
#             distfile URL: https://github.com/{args}/releases/download/{tag}/{pkgname}-{version}.tar.gz
#
# To add a new package, append a line below.
obsidian|github|obsidianmd/obsidian-releases
