format = """
$hostname$directory$fill$git_branch$git_status$cmd_duration
$character
"""

[username]
format = "[$user]($style)"
show_always = true

[hostname]
style = "#fab387"
ssh_only = true
format = "[$hostname]($style) "

[character]
success_symbol = '[\$](green)'
error_symbol = '[\$](red)'
vimcmd_symbol = '[N](blue)'
vimcmd_visual_symbol = '[V](yellow)'
#success_symbol = "[➜](bold green)"
#error_symbol = "[➜](bold red)"

#[directory]
#format = " [$path]($style) "

[fill]
symbol = " "

[nix_shell]
disabled = false
format = "nix "
style = "bold blue"
